<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Frigo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5ee;color:#263d32;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:650px;margin:auto;padding:24px 18px 110px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:35px;letter-spacing:-2px;margin:0}h2{font-size:25px;letter-spacing:-.7px}small,.muted{color:#66776c}button,input,select{font:inherit}button{border:0;border-radius:14px;padding:12px 16px;background:#dce8d9;color:#263d32;cursor:pointer}.primary{background:#315b45;color:white} .hero{background:#315b45;color:white;padding:23px;border-radius:25px;margin:24px 0}.hero small{color:#dbe8db}.hero h2{margin:8px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.card{background:#fff;border-radius:19px;padding:16px;margin:10px 0;box-shadow:0 3px 12px #23402008}.emoji{font-size:32px;background:#f1f4eb;border-radius:14px;padding:10px}.grow{flex:1}.tag{display:inline-block;font-size:12px;border-radius:20px;padding:5px 9px;background:#e2efdf}.warn{background:#ffebc4;color:#875209}.bad{background:#f9d9d5;color:#932d25}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-top:1px solid #ddd}nav button{background:none;font-size:11px;min-width:19%;padding:6px 2px;color:#77867b}nav b{display:block;font-size:23px;margin-bottom:4px}nav .active{color:#315b45;font-weight:bold}input,select{width:100%;border:1px solid #d4ddd2;padding:12px;border-radius:12px;background:white;margin:5px 0 12px}label{font-size:13px;font-weight:600}dialog{border:0;border-radius:24px;width:min(94%,480px);max-height:90vh;overflow:auto;padding:22px;color:#263d32}dialog::backdrop{background:#172c2566}.chips{display:flex;gap:7px;overflow:auto}.chips button{white-space:nowrap;padding:9px 12px}.selected{background:#315b45;color:white}.bar{height:8px;background:#e8ede5;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#699b71}.actions{display:flex;gap:8px;flex-wrap:wrap}p{line-height:1.5}.check{text-decoration:line-through;opacity:.5}</style><main><header><div><small>TU COCINA, EN EQUILIBRIO</small><h1>frigo<span style="color:#84a687">.</span></h1></div><button class="primary" onclick="edit()">＋ Alimento</button></header><div id="view"></div></main><nav id="nav"></nav><dialog id="modal"></dialog><script>
const foods={huevo:['🥚',143,13,10,1,'Fuente de proteínas y micronutrientes.'],pollo:['🍗',120,23,3,0,'Proteína magra; cocinar completamente.'],tomate:['🍅',18,1,0,4,'Verdura rica en agua y variedad de micronutrientes.'],aguacate:['🥑',160,2,15,9,'Aporta grasas insaturadas y fibra.'],arroz:['🍚',360,7,1,79,'Fuente de energía; valores en seco.'],pasta:['🍝',350,12,2,72,'Fuente de hidratos; valores en seco.'],espinacas:['🥬',23,3,0,4,'Verdura con fibra y micronutrientes.'],leche:['🥛',61,3,3,5,'Aporta proteínas y calcio; valor orientativo leche entera.'],patata:['🥔',77,2,0,17,'Fuente de energía y potasio.'],cebolla:['🧅',40,1,0,9,'Verdura que aporta variedad y sabor.'],atún:['🐟',116,26,1,0,'Proteína; valor orientativo al natural.'],yogur:['🥣',63,5,2,7,'Aporta calcio y proteínas; depende del producto.'],manzana:['🍎',52,0,0,14,'Fruta con fibra.'],zanahoria:['🥕',41,1,0,10,'Aporta fibra y carotenoides.'],queso:['🧀',350,24,28,2,'Aporta calcio, pero puede contener bastante sal y grasas saturadas.'],aceite:['🫒',884,0,100,0,'Grasas insaturadas si es aceite de oliva; energético.']};
const recipes=[['Tortilla de espinacas','🍳',15,{huevo:120,espinacas:80,aceite:5},'Saltea las espinacas. Bate los huevos, mezcla y cuaja la tortilla por ambos lados.'],['Ensalada de aguacate y tomate','🥗',10,{aguacate:100,tomate:150,aceite:5},'Lava el tomate, corta los ingredientes y aliña con aceite.'],['Arroz con pollo','🍚',30,{arroz:70,pollo:150,cebolla:50,aceite:5},'Cuece el arroz. Sofríe la cebolla y cocina el pollo completamente. Mezcla y sirve.'],['Pasta con atún y tomate','🍝',25,{pasta:80,atún:100,tomate:150,aceite:5},'Cuece la pasta. Cocina el tomate con aceite, incorpora el atún y mezcla.'],['Tortilla de patata','🥘',35,{patata:200,huevo:120,cebolla:50,aceite:10},'Cocina la patata y cebolla hasta que estén tiernas. Mezcla con huevo batido y cuaja completamente.'],['Pollo con verduras','🍗',25,{pollo:150,zanahoria:100,espinacas:80,aceite:5},'Saltea las verduras y cocina el pollo completamente. Sirve junto.'],['Yogur con manzana','🍎',5,{yogur:125,manzana:150},'Lava y corta la manzana. Mezcla con el yogur.']];
let load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, inv=load('frigoInv',[]), shopping=load('frigoShop',[]), stats=load('frigoStats',{used:0,waste:0}),tab='nevera',filter='Todo',query='',maxCal=0; const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem('frigoInv',JSON.stringify(inv));localStorage.setItem('frigoShop',JSON.stringify(shopping));localStorage.setItem('frigoStats',JSON.stringify(stats))}catch{alert('No se ha podido guardar en este navegador.')}render()}, days=x=>x.date?Math.round((new Date(x.date+'T00:00:00')-new Date(new Date().setHours(0,0,0,0)))/86400000):Infinity, key=s=>s.toLowerCase().trim(), info=x=>foods[key(x.name)]||['📦',null,null,null,null,'Sin información nutricional disponible.'], available=n=>inv.filter(x=>key(x.name)===n&&!(x.type==='Caducidad'&&days(x)<0)).reduce((a,x)=>a+Number(x.qty),0), kcal=r=>Math.round(Object.entries(r[3]).reduce((a,[n,q])=>a+foods[n][1]*q/100,0)), match=r=>Object.entries(r[3]).filter(([n,q])=>available(n)>=q).length/Object.keys(r[3]).length;
function render(){let v=$('view');$('nav').innerHTML=[['nevera','▣','Nevera'],['recetas','♨','Recetas'],['compra','✓','Compra'],['datos','◷','Estadísticas']].map(([id,ic,n])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render()"><b>${ic}</b>${n}</button>`).join('');if(tab==='nevera'){let soon=inv.filter(x=>days(x)<=3&&days(x)>=0).length;v.innerHTML=`<div class="hero"><small>MI INVENTARIO</small><h2>${inv.length} alimentos · ${soon} por vencer</h2><div>Organiza tu cocina y aprovecha lo que tienes.</div></div><div class="chips">${['Todo','Nevera','Congelador','Despensa'].map(n=>`<button class="${filter===n?'selected':''}" onclick="filter='${n}';render()">${n}</button>`).join('')}</div><h2>Mis alimentos</h2>${inv.filter(x=>filter==='Todo'||x.place===filter).sort((a,b)=>days(a)-days(b)).map(x=>{let d=days(x),tag=d===Infinity?'Sin fecha':d<0?'Fecha superada':d===0?'Hoy':d+' días';return `<div class="card row"><span class="emoji">${info(x)[0]}</span><div class="grow" onclick="detail('${x.id}')"><strong>${esc(x.name)}</strong><br><small>${x.qty} g · ${esc(x.place)}</small><br><span class="tag ${d<0?'bad':d<=3?'warn':''}">${tag}</span></div><button onclick="edit('${x.id}')">✎</button></div>`}).join('')||'<div class="card">Aún no hay alimentos aquí. Añade el primero o prueba los datos de ejemplo.</div>'}<button onclick="demo()">Cargar ejemplo</button>`}else if(tab==='recetas'){v.innerHTML=`<div class="hero"><small>COCINA CON LO QUE TIENES</small><h2>Ideas para hoy</h2>Recetas de un catálogo local, adaptadas a tu inventario.</div><label>Calorías máximas por ración</label><select onchange="maxCal=+this.value;render()">${[0,300,500,700].map(n=>`<option value="${n}" ${maxCal===n?'selected':''}>${n?n+' kcal':'Sin límite'}</option>`).join('')}</select>${recipes.map((r,i)=>({r,i})).filter(({r})=>!maxCal||kcal(r)<=maxCal).sort((a,b)=>match(b.r)-match(a.r)).map(({r,i})=>`<div class="card" onclick="recipe(${i})"><div class="row"><span class="emoji">${r[1]}</span><div class="grow"><strong>${r[0]}</strong><p class="muted" style="margin:5px 0">${r[2]} min · ${kcal(r)} kcal</p></div>›</div><p>${Math.round(match(r)*100)}% de ingredientes disponibles</p><div class="bar"><i style="width:${match(r)*100}%"></i></div></div>`).join('')}`}else if(tab==='compra'){v.innerHTML=`<h2>Lista de la compra</h2><form onsubmit="event.preventDefault();shopping.push({name:$('item').value,done:false});save()"><div class="row"><input id="item" required placeholder="Añadir producto"><button class="primary">＋</button></div></form>${shopping.map((x,i)=>`<div class="card row"><div class="grow ${x.done?'check':''}" onclick="shopping[${i}].done=!shopping[${i}].done;save()">${x.done?'☑':'☐'} ${esc(x.name)}</div><button onclick="shopping.splice(${i},1);save()">×</button></div>`).join('')||'<p class="muted">Añade productos o ingredientes que te falten en una receta.</p>'}`}else{v.innerHTML=`<h2>Tu impacto</h2><div class="card"><small>ALIMENTOS CONSUMIDOS</small><h2>${stats.used}</h2></div><div class="card"><small>ALIMENTOS DESECHADOS</small><h2>${stats.waste}</h2></div><p class="muted">Contadores de registros retirados, no de calorías ingeridas ni de dinero ahorrado.</p>`}}
function show(s){$('modal').innerHTML=s;$('modal').showModal()}function closeM(){$('modal').close()}function edit(id){let x=inv.find(x=>x.id===id)||{name:'',qty:100,date:'',place:'Nevera',type:'Caducidad'};show(`<div class="row"><h2>${id?'Editar':'Nuevo'} alimento</h2><button onclick="closeM()">×</button></div><form onsubmit="event.preventDefault();let a={id:'${id||''}'||Date.now().toString(),name:$('name').value.trim(),qty:+$('qty').value,date:$('date').value,place:$('place').value,type:$('type').value};inv=inv.filter(x=>x.id!==a.id);inv.push(a);closeM();save()"><label>Alimento</label><input id="name" list="names" required value="${esc(x.name)}" placeholder="Ej. Tomate"><datalist id="names">${Object.keys(foods).map(n=>`<option value="${n}">`).join('')}</datalist><label>Cantidad (gramos)</label><input id="qty" type="number" min="1" required value="${x.qty}"><label>Ubicación</label><select id="place">${['Nevera','Congelador','Despensa'].map(n=>`<option ${x.place===n?'selected':''}>${n}</option>`)}</select><label>Tipo de fecha</label><select id="type">${['Caducidad','Consumo preferente'].map(n=>`<option ${x.type===n?'selected':''}>${n}</option>`)}</select><label>Fecha</label><input id="date" type="date" value="${x.date}"><button class="primary" style="width:100%">Guardar alimento</button></form>`)}
function detail(id){let x=inv.find(x=>x.id===id),f=info(x);show(`<div class="row"><h2>${f[0]} ${esc(x.name)}</h2><button onclick="closeM()">×</button></div><p>${x.qty} g · ${esc(x.type)}: ${esc(x.date||'Sin fecha')}</p><h3>Nutrición por 100 g</h3>${f[1]===null?'Sin datos':`<div class="card">${f[1]} kcal · ${f[2]} g proteína<br>${f[3]} g grasa · ${f[4]} g hidratos</div>`}<p>${f[5]}</p><small>Valores genéricos orientativos. La fecha no garantiza la seguridad del alimento.</small><p class="actions"><button onclick="removeFood('${id}','used')">Consumido</button><button onclick="removeFood('${id}','waste')">Desechado</button></p>`)}function removeFood(id,t){inv=inv.filter(x=>x.id!==id);stats[t]++;closeM();save()}
function recipe(i){let r=recipes[i];show(`<div class="row"><h2>${r[1]} ${r[0]}</h2><button onclick="closeM()">×</button></div><p>${r[2]} min · ${kcal(r)} kcal aproximadas · 1 ración</p><h3>Ingredientes</h3>${Object.entries(r[3]).map(([n,q])=>`<p>${available(n)>=q?'✓':'＋'} ${n}: ${q} g ${available(n)<q?'(faltan '+(q-available(n))+' g)':''}</p>`).join('')}<h3>Preparación</h3><p>${r[4]}</p><button class="primary" onclick="addMissing(${i})">Añadir faltantes a la compra</button><p><small>Revisa conservación, alérgenos y cantidades antes de cocinar.</small></p>`)}function addMissing(i){Object.entries(recipes[i][3]).forEach(([n,q])=>{let missing=q-available(n);if(missing>0)shopping.push({name:n+' · '+missing+' g',done:false})});closeM();tab='compra';save()}function demo(){if(!confirm('¿Añadir seis alimentos de ejemplo al inventario?'))return;['huevo','tomate','aguacate','pollo','espinacas','aceite'].forEach((n,i)=>{let d=new Date();d.setDate(d.getDate()+i+1);inv.push({id:'demo'+Date.now()+i,name:n,qty:200,date:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),place:i===5?'Despensa':'Nevera',type:'Caducidad'})});save()}render();</script></html>
