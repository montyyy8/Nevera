let load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}, inv=load('frigoInv',[]), shopping=load('frigoShop',[]), stats=load('frigoStats',{used:0,waste:0}),custom=load('frigoRecipes',[]),tab='nevera',filter='Todo',query='',maxCal=0; const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem('frigoInv',JSON.stringify(inv));localStorage.setItem('frigoShop',JSON.stringify(shopping));localStorage.setItem('frigoStats',JSON.stringify(stats));localStorage.setItem('frigoRecipes',JSON.stringify(custom))}catch{alert('No se ha podido guardar en este navegador.')}render()}, days=x=>x.date?Math.round((new Date(x.date+'T00:00:00')-new Date(new Date().setHours(0,0,0,0)))/86400000):Infinity, key=s=>s.toLowerCase().trim(), info=x=>foods[key(x.name)]||['📦',null,null,null,null,'Sin información nutricional disponible.'], available=n=>inv.filter(x=>key(x.name)===n&&!(x.type==='Caducidad'&&days(x)<0)).reduce((a,x)=>a+grams(x.qty),0), kcal=r=>Object.keys(r[3]).some(n=>!foods[n])?null:Math.round(Object.entries(r[3]).reduce((a,[n,q])=>a+(foods[n]?.[1]??0)*q/100,0)), match=r=>Object.entries(r[3]).filter(([n,q])=>available(n)>=q).length/Object.keys(r[3]).length;
recipes.push(...custom);function grams(q){if(typeof q==='number')return q;let m=String(q).trim().match(/^(\d+(?:[.,]\d+)?)\s*(g|gr|gramos?|kg|kilos?)?$/i);return m?Number(m[1].replace(',','.'))*(/kg|kilo/i.test(m[2]||'')?1000:1):0}function qtyText(q){return typeof q==='number'?q+' g':esc(q)}function photo(x){return x.photo&&/^data:image\/(jpeg|png|webp);base64,/.test(x.photo)?`<img class="photo" src="${x.photo}" alt="Foto del alimento">`:`<span class="emoji">${info(x)[0]}</span>`}let pendingPhoto='',photoBusy=false, aisle='Todo', shopQuery='';function render(){let v=$('view');$('nav').innerHTML=[['nevera','▣','Nevera'],['recetas','♨','Recetas'],['compra','✓','Compra'],['datos','◷','Estadísticas']].map(([id,ic,n])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render()"><b>${ic}</b>${n}</button>`).join('');if(tab==='nevera'){let soon=inv.filter(x=>days(x)<=3&&days(x)>=0).length;v.innerHTML=`<div class="hero"><small>MI INVENTARIO</small><h2>${inv.length} alimentos · ${soon} por vencer</h2><div>Organiza tu cocina y aprovecha lo que tienes.</div></div><div class="chips">${['Todo','Nevera','Congelador','Despensa'].map(n=>`<button class="${filter===n?'selected':''}" onclick="filter='${n}';render()">${n}</button>`).join('')}</div><h2>Mis alimentos</h2>${inv.filter(x=>filter==='Todo'||x.place===filter).sort((a,b)=>days(a)-days(b)).map(x=>{let d=days(x),tag=d===Infinity?'Sin fecha':d<0?'Fecha superada':d===0?'Hoy':d+' días';return `<div class="card row">${photo(x)}<div class="grow" onclick="detail('${x.id}')"><strong>${esc(x.name)}</strong><br><small>${qtyText(x.qty)} · ${esc(x.place)}</small><br><span class="tag ${d<0?'bad':d<=3?'warn':''}">${tag}</span></div><button onclick="edit('${x.id}')">✎</button></div>`}).join('')||'<div class="card">Aún no hay alimentos aquí. Añade el primero o prueba los datos de ejemplo.</div>'}<button onclick="demo()">Cargar ejemplo</button>`}else if(tab==='recetas'){v.innerHTML=`<div class="hero"><small>COCINA CON LO QUE TIENES</small><h2>Ideas para hoy</h2>Recetas adaptadas a tu inventario.</div><button class="primary" onclick="newRecipe()">＋ Crear mi receta</button><label>Calorías máximas por ración</label><select onchange="maxCal=+this.value;render()">${[0,300,500,700].map(n=>`<option value="${n}" ${maxCal===n?'selected':''}>${n?n+' kcal':'Sin límite'}</option>`).join('')}</select>${recipes.map((r,i)=>({r,i})).filter(({r})=>!maxCal||(kcal(r)!==null&&kcal(r)<=maxCal)).sort((a,b)=>match(b.r)-match(a.r)).map(({r,i})=>`<div class="card" onclick="recipe(${i})"><div class="row"><span class="emoji">${r[1]}</span><div class="grow"><strong>${esc(r[0])}</strong><p class="muted" style="margin:5px 0">${r[2]} min · ${kcal(r)===null?'Sin datos de kcal':kcal(r)+' kcal'}</p></div>›</div><p>${Math.round(match(r)*100)}% de ingredientes disponibles</p><div class="bar"><i style="width:${match(r)*100}%"></i></div></div>`).join('')}`}else if(tab==='compra'){v.innerHTML=`<div class="hero"><small>PASILLOS DEL MERCADO</small><h2>Tu supermercado</h2>${shopping.filter(x=>!x.done).length} productos pendientes en tu cesta</div><div class="card basket"><h2>🛒 Mi cesta</h2>${shopping.map((x,i)=>`<div class="row" style="margin:8px 0"><div class="grow ${x.done?'check':''}" onclick="shopping[${i}].done=!shopping[${i}].done;save()">${x.done?'☑':'☐'} ${esc(x.name)} ${x.count>1?' × '+x.count:''}</div><button onclick="shopping.splice(${i},1);save()">×</button></div>`).join('')||'Tu cesta está vacía'}<button onclick="shopping=shopping.filter(x=>!x.done);save()">Retirar comprados</button></div><form onsubmit="event.preventDefault();addShop($('item').value)"><div class="row"><input id="item" required placeholder="Añadir producto propio"><button class="primary">＋</button></div></form><input placeholder="Buscar en el supermercado" value="${esc(shopQuery)}" oninput="shopQuery=this.value;market()"><div id="market"></div>`;market()}else{v.innerHTML=`<h2>Tu impacto</h2><div class="card"><small>ALIMENTOS CONSUMIDOS</small><h2>${stats.u function addShop(n){n=n.trim();if(!n)return;let x=shopping.find(x=>x.name===n&&!x.done);if(x)x.count=(x.count||1)+1;else shopping.push({name:n,done:false,count:1});save()}function market(){let m=$('market');if(!m)return;m.innerHTML=`<div class="chips">${['Todo',...Object.keys(aisles)].map((n,i)=>`<button class="${aisle===n?'selected':''}" onclick="aisle=Object.keys(aisles)[${i-1}]||'Todo';market()">${n}</button>`).join('')}</div>`+Object.entries(aisles).map(([n,list],i)=>{if(aisle!=='Todo'&&aisle!==n)return '';let items=list.split(',').filter(x=>x.includes(shopQuery.toLowerCase()));return items.length?`<h3>${icons[i]} ${n}</h3><div class="grid">${items.map(x=>`<div class="card"><span class="emoji">${foods[x]?.[0]||icons[i]}</span><strong>${x}</strong><button class="primary" onclick="addShop('${x}')">＋ Cesta</button></div>`).join('')}</div>`:''}).join('')}function newRecipe(){show(`<div class="row"><h2>Mi receta</h2><button onclick="closeM()">×</button></div><form onsubmit="event.preventDefault();storeRecipe()"><label>Nombre</label><input id="rn" required><label>Minutos</label><input id="rt" type="number" min="1" required value="20"><label>Ingredientes por ración (nombre: gramos, uno por línea)</label><textarea id="ri" required rows="5" placeholder="pollo: 150"></textarea><label>Preparación (un paso por línea)</label><textarea id="rs" required rows="5"></textarea><button class="primary">Guardar receta</button></form>`)}function storeRecipe(){let ing={};for(let line of $('ri').value.trim().split(/\n/)){let [n,q]=line.split(':');let g=Number(q);if(!n||!Number.isFinite(g)||g<=0){alert('Introduce cada ingrediente como pollo: 150');return}ing[key(n)]=g}let r=[$('rn').value.trim(),'🍽️',+$('rt').value,ing,$('rs').value];custom.push(r);recipes.push(r);closeM();save()}function readPhoto(input){let f=input.files[0];if(!f)return;photoBusy=true;let reader=new FileReader();reader.onerror=()=>{photoBusy=false;alert('No se pudo leer la foto')};reader.onload=()=>{let im=new Image();im.onerror=()=>{photoBusy=false;alert('Formato no compatible')};im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,480/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);pendingPhoto=c.toDataURL('image/jpeg',.65);photoBusy=false;$('photoPreview').innerHTML=photo({photo:pendingPhoto})};im.src=reader.result};reader.readAsDataURL(f)}function show(s){$('modal').innerHTML=s;$('modal').showModal()}function closeM(){$('modal').close()}function edit(id){let x=inv.find(x=>x.id===id)||{name:'',qty:100,date:'',place:'Nevera',type:'Caducidad'};pendingPhoto=x.photo||'';photoBusy=false;show(`<div class="row"><h2>${id?'Editar':'Nuevo'} alimento</h2><button onclick="closeM()">×</button></div><form onsubmit="event.preventDefault();if(photoBusy)return;let a={id:'${id||''}'||Date.now().toString(),name:$('name').value.trim(),qty:$('qty').value.trim(),photo:pendingPhoto,date:$('date').value,place:$('place').value,type:$('type').value};inv=inv.filter(x=>x.id!==a.id);inv.push(a);closeM();save()"><label>Alimento</label><input id="name" list="names" required value="${esc(x.name)}" placeholder="Ej. Tomate"><datalist id="names">${Object.keys(foods).map(n=>`<option value="${n}">`).join('')}</datalist><label>Cantidad libre</label><input id="qty" required value="${esc(typeof x.qty==='number'?x.qty+' g':x.qty)}" placeholder="2 unidades, medio paquete, 500 g"><label>Foto del alimento</label><div id="photoPreview">${x.photo?photo(x):''}</div><input type="file" accept="image/*" capture="environment" onchange="readPhoto(this)"><label>O elegir de la galería</label><input type="file" accept="image/*" onchange="readPhoto(this)"><button type="button" onclick="pendingPhoto='';$('photoPreview').innerHTML=''">Quitar foto</button><p><small>Para calcular faltantes automáticamente, indica gramos o kilos.</small></p><label>Ubicación</label><select id="place">${['Nevera','Congelador','Despensa'].map(n=>`<option ${x.place===n?'selected':''}>${n}</option>`)}</select><label>Tipo de fecha</label><select id="type">${['Caducidad','Consumo preferente'].map(n=>`<option ${x.type===n?'selected':''}>${n}</option>`)}</select><label>Fecha</label><input id="date" type="date" value="${x.date}"><button class="primary" style="width:100%">Guardar alimento</button></form>`)}
function detail(id){let x=inv.find(x=>x.id===id),f=info(x);show(`<div class="row"><h2>${f[0]} ${esc(x.name)}</h2><button onclick="closeM()">×</button></div>${x.photo?photo(x):''}<p>${qtyText(x.qty)} · ${esc(x.type)}: ${esc(x.date||'Sin fecha')}</p><h3>Nutrición por 100 g</h3>${f[1]===null?'Sin datos':`<div class="card">${f[1]} kcal · ${f[2]} g proteína<br>${f[3]} g grasa · ${f[4]} g hidratos</div>`}<p>${f[5]}</p><small>Valores genéricos orientativos. La fecha no garantiza la seguridad del alimento.</small><p class="actions"><button onclick="removeFood('${id}','used')">Consumido</button><button onclick="removeFood('${id}','waste')">Desechado</button></p>`)}function removeFood(id,t){inv=inv.filter(x=>x.id!==id);stats[t]++;closeM();save()}
function recipe(i){let r=recipes[i];show(`<div class="row"><h2>${r[1]} ${esc(r[0])}</h2><button onclick="closeM()">×</button></div><p>${r[2]} min · ${kcal(r)===null?'Sin datos de kcal':kcal(r)+' kcal'} aproximadas · 1 ración</p><h3>Ingredientes</h3>${Object.entries(r[3]).map(([n,q])=>`<p>${available(n)>=q?'✓':'＋'} ${esc(n)}: ${q} g ${available(n)<q?'(faltan '+(q-available(n))+' g)':''}</p>`).join('')}<h3>Preparación</h3><ol class="steps">${r[4].split(/\n|(?<=\.)\s+/).filter(Boolean).map(t=>`<li>${esc(t)}</li>`).join('')}</ol><small>Las cantidades libres que no están en gramos o kilos no se descuentan automáticamente.</small><button class="primary" onclick="addMissing(${i})">Añadir faltantes a la compra</button><p><small>Revisa conservación, alérgenos y cantidades antes de cocinar.</small></p>`)}function addMissing(i){Object.entries(recipes[i][3]).forEach(([n,q])=>{let missing=q-available(n);if(missing>0)shopping.push({name:n+' · '+missing+' g',done:false})});closeM();tab='compra';save()}function demo(){if(!confirm('¿Añadir seis alimentos de ejemplo al inventario?'))return;['huevo','tomate','aguacate','pollo','espinacas','aceite'].forEach((n,i)=>{let d=new Date();d.setDate(d.getDate()+i+1);inv.push({id:'demo'+Date.now()+i,name:n,qty:200,date:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),place:i===5?'Despensa':'Nevera',type:'Caducidad'})});save()}render();</script></html>
